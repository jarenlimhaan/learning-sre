apiVersion: v1
kind: Pod
metadata:
  name: color-backend
  labels:
    app: color-api
    enviroment: local
    tier: baclend
spec:
  containers:
    - name: color-backend
      image: lmacademy/color-api:1.1.0
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: color-frontend
  labels:
    app: color-api
    enviroment: local
    tier: frontend
spec:
  containers:
    - name: color-frontend
      image: nginx:1.27.0
      ports:
        - containerPort: 80
---
