## onlu needed if you want to use the k8s-dashboard-view service account to view the dashboard
## not needed when using the newer headlamp dashboard
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-dashboard-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: k8s-dashboard-view
    namespace: k8s-dashboard