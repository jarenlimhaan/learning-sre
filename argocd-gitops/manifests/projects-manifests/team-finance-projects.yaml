apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-finance
  namespace: argocd
spec:
  description: Team Finance Project with security guardrails

  sourceRepos:
  - "https://github.com/jarenlimhaan/argocd-example-apps-lab.git"

  destinations:
  - server: https://kubernetes.default.svc
    namespace: finance 
  
  # clusterResourceWhitelist:
  #   - group: "*"
  #     kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"